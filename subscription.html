<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اشتراكي — ✨️ FT</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <canvas id="golden-particles"></canvas>
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="sidebar-logo">✨</div><div><div class="sidebar-title">FT</div><div class="sidebar-sub">اشتراكي</div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link"><i data-lucide="home"></i> الرئيسية</a>
      <a href="shop.html" class="nav-link"><i data-lucide="shopping-cart"></i> المتجر</a>
      <a href="personal.html" class="nav-link"><i data-lucide="user"></i> القسم الفردي</a>
      <a href="subscription.html" class="nav-link active"><i data-lucide="star"></i> اشتراكي</a>
      <a href="support.html" class="nav-link"><i data-lucide="headphones"></i> الدعم</a>
      <a href="admin.html" class="nav-link" data-admin-only style="display:none"><i data-lucide="shield"></i> لوحة الإدارة</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card"><div class="user-avatar" id="userAvatar">?</div><div style="min-width:0;flex:1"><div class="user-name" id="userName">—</div><div class="user-role" id="userRole">—</div></div></div>
      <button class="btn btn-ghost btn-block btn-sm" data-logout><i data-lucide="log-out"></i> خروج</button>
    </div>
  </aside>
  <div class="sidebar-backdrop"></div>
  <header class="topbar">
    <div class="flex" style="align-items:center;gap:12px"><button class="hamburger"><i data-lucide="menu"></i></button><div class="topbar-title">⭐ اشتراكي</div></div>
    <div class="topbar-actions"><button class="icon-btn" data-theme-toggle><i data-lucide="sun-moon"></i></button></div>
  </header>
  <main class="main-content">
    <div class="container">
      <div class="card card-golden mb-4">
        <h3 class="card-title"><i data-lucide="calendar"></i> حالة الاشتراك</h3>
        <div class="grid-3 mt-3">
          <div><small class="text-muted">ينتهي في</small><div style="font-size:1.5rem;font-weight:800" id="expiry">—</div></div>
          <div><small class="text-muted">المتبقي</small><div style="font-size:1.3rem;font-weight:800;color:var(--amber);line-height:1.3" id="remain">—</div></div>
          <div><small class="text-muted">الحالة</small><div id="statusBadge" class="mt-1">—</div></div>
        </div>
      </div>

      <h3 class="mb-3">🔄 باقات التجديد</h3>
      <div class="grid-3 mb-4" id="plansGrid"></div>

      <h3 class="mb-3">📜 سجل الطلبات</h3>
      <div class="card" id="requestsList"></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- ✅ التعديل 7: تحديث الكاش -->
  <script src="js/db.js?v=11"></script>
  <script src="js/common.js?v=11"></script>
  <script src="js/subscription.js?v=11"></script>
</body>
</html>
